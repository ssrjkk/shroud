name: shardstore

on:
  push:
    branches: [main]
    paths: ["infra/shardstore/**", ".github/workflows/shardstore.yml"]
  pull_request:
    paths: ["infra/shardstore/**", ".github/workflows/shardstore.yml"]
  workflow_dispatch:

jobs:
  test:
    name: server unit tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: infra/shardstore
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node --test keccak.test.mjs guard.test.mjs server.test.mjs hardening.test.mjs
