name: sdk

on:
  push:
    branches: [main]
    paths: ["packages/sdk/**", ".github/workflows/sdk.yml"]
  pull_request:
    paths: ["packages/sdk/**", ".github/workflows/sdk.yml"]
  workflow_dispatch:

jobs:
  test:
    name: build + test + typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: packages/sdk/package-lock.json
      # The SDK smoke tests cross-check its embedded ABIs against the compiled contracts, so the
      # contract artifacts must exist first.
      - run: npm ci
        working-directory: packages/contracts
      - run: npx hardhat compile
        working-directory: packages/contracts
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
