name: sdk

on:
  push:
    branches: [master]
    paths: ["packages/sdk/**", ".github/workflows/sdk.yml"]
  pull_request:
    paths: ["packages/sdk/**", ".github/workflows/sdk.yml"]
  workflow_dispatch:

jobs:
  test:
    name: build + test + typecheck
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: packages/sdk
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/sdk/package-lock.json
      # The SDK smoke tests cross-check its embedded ABIs against the compiled contracts, so the
      # contract artifacts must exist first.
      - run: npm ci
        working-directory: packages/contracts
      - run: npx hardhat compile
        working-directory: packages/contracts
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test

  relayer-live:
    name: live relayer encryption (Sepolia)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: packages/sdk
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/sdk/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: node --test test/live-relayer.test.ts
        env:
          SHROUD_LIVE_RELAYER: "1"
        timeout-minutes: 10
