name: site

on:
  push:
    branches: [main]
    # `node/**` (not just the layout pins): any engine change re-checks the site math
    # against the golden vectors both sides pin. The threat model is named
    # explicitly (not `docs/**`): the site quotes its finding count, so a change
    # to the model must re-check that the quote still matches — but an unrelated
    # doc edit should not redeploy the site.
    paths: ["web/**", "node/**", "docs/04-threat-model.md", ".github/workflows/site.yml"]
  pull_request:
    paths: ["web/**", "node/**", "docs/04-threat-model.md", ".github/workflows/site.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: package static site
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/tests/package-lock.json
      - name: install static-site test dependencies
        run: npm ci --prefix web/tests --ignore-scripts
      - name: audit static-site test dependencies
        run: npm audit --prefix web/tests --audit-level=high
      - name: check internal links resolve
        run: |
          python3 - <<'EOF'
          import re, sys
          from pathlib import Path
          web = Path("web")
          pages = {p.name for p in web.glob("*.html")}
          assets = {str(p.relative_to(web)).replace("\\", "/") for p in web.rglob("*") if p.is_file()}
          bad = []
          for html in web.glob("*.html"):
              text = html.read_text()
              # only resource-bearing tags: <base href> is deployment config, not a file
              for m in re.finditer(r'''<(?:a|link|script|img)[^>]+(?:href|src)="([^"#]+)"''', text):
                  target = m.group(1)
                  if target.startswith(("http", "data:", "mailto:")):
                      continue
                  norm = (target[2:] if target.startswith("./") else target.lstrip("/"))
                  if norm not in assets:
                      bad.append(f"{html.name}: {target}")
          if bad:
              print("broken site links:"); print("\n".join(bad)); sys.exit(1)
          print(f"site links OK: {len(pages)} pages")
          # README-embedded screenshots must exist too (docs/shots/*)
          shots = [m.group(1) for m in re.finditer(r'''\((docs/shots/[^)]+)\)''', Path("README.md").read_text())]
          missing = [s for s in shots if not Path(s).is_file()]
          if missing:
              print("missing README shots:"); print("\n".join(missing)); sys.exit(1)
          print(f"README shots OK: {len(shots)} files")
          # Site math must match the golden vectors pinned with the Rust node
          # (node/src/fhe.rs pins the same file from the other side).
          EOF
      - name: check site math matches golden vectors
        run: node web/tests/equiv.mjs
      - name: check i18n dictionary
        run: node web/tests/i18n.mjs
      - name: check navigation across pages
        run: node web/tests/nav.mjs
      - name: check accessibility invariants
        run: node web/tests/a11y.mjs
      - name: check the site's finding count matches the threat model
        run: node web/tests/findings.mjs
