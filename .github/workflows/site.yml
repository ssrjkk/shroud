name: site

on:
  push:
    branches: [master]
    # `node/**` (not just the layout pins): any engine change re-checks the site math
    # against the golden vectors both sides pin.
    paths: ["web/**", "node/**", ".github/workflows/site.yml"]
  pull_request:
    paths: ["web/**", "node/**", ".github/workflows/site.yml"]
  workflow_dispatch:

# Pages deployment needs these; PRs from forks cannot deploy, so the deploy
# job is master-only below while build still validates every PR.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: package static site
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v5
      - name: check internal links resolve
        run: |
          python3 - <<'EOF'
          import re, sys
          from pathlib import Path
          web = Path("web")
          pages = {p.name for p in web.glob("*.html")}
          assets = {str(p.relative_to(web)).replace("\\", "/") for p in web.rglob("*") if p.is_file()}
          bad = []
          for html in web.glob("*.html"):
              text = html.read_text()
              # only resource-bearing tags: <base href> is deployment config, not a file
              for m in re.finditer(r'''<(?:a|link|script|img)[^>]+(?:href|src)="([^"#]+)"''', text):
                  target = m.group(1)
                  if target.startswith(("http", "data:", "mailto:")):
                      continue
                  norm = (target[2:] if target.startswith("./") else target.lstrip("/"))
                  if norm not in assets:
                      bad.append(f"{html.name}: {target}")
          if bad:
              print("broken site links:"); print("\n".join(bad)); sys.exit(1)
          print(f"site links OK: {len(pages)} pages")
          # README-embedded screenshots must exist too (docs/shots/*)
          shots = [m.group(1) for m in re.finditer(r'''\((docs/shots/[^)]+)\)''', Path("README.md").read_text())]
          missing = [s for s in shots if not Path(s).is_file()]
          if missing:
              print("missing README shots:"); print("\n".join(missing)); sys.exit(1)
          print(f"README shots OK: {len(shots)} files")
          # Site math must match the golden vectors pinned with the Rust node
          # (node/src/fhe.rs pins the same file from the other side).
          EOF
      - name: check site math matches golden vectors
        run: node web/tests/equiv.mjs
      - name: forbid default-branch links
        run: |
          if grep -rnE 'github\.com/ssrjkk/shroud/(tree|blob)/main/' web/ docs/ README.md CONTRIBUTING.md; then
            echo "Found forbidden /main/ branch links; use /HEAD/ instead."
            exit 1
          fi
      - name: check external links with lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --verbose --no-progress --accept 200..=299,429 './web/**/*.html' './README.md' './docs/**/*.md'
          fail: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    name: deploy to GitHub Pages
    if: github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
