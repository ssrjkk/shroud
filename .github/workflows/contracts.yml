name: contracts

on:
  push:
    branches: [main]
    paths: ["packages/contracts/**", "packages/sdk/scripts/devnet-check.mjs", "packages/sdk/package.json", ".github/workflows/contracts.yml"]
  pull_request:
    paths: ["packages/contracts/**", "packages/sdk/scripts/devnet-check.mjs", "packages/sdk/package.json", ".github/workflows/contracts.yml"]
  workflow_dispatch:

jobs:
  test:
    name: compile + test + typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/contracts
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/contracts/package-lock.json
      - run: npm ci
      # Regression gate: the contracts tree pulls the full Hardhat dependency
      # closure (undici, adm-zip, tmp, cookie, diff, serialize-javascript, uuid,
      # busboy). Overrides in package.json pin the fixed transitive versions;
      # this fails the build if a new high/critical advisory appears instead of
      # waiting for the weekly Dependabot scan.
      - run: npm audit --audit-level=high
      - run: npx hardhat compile
      # `npm test` runs `hardhat test` and then the `test-vectors/` parity spec in its own process.
      # Invoking `hardhat test` alone would skip the vectors: they live outside `paths.tests` so they
      # get a fresh chain, which is what makes their pinned addresses meaningful.
      - run: npm test
      - run: npx tsc --noEmit

  foundry:
    name: foundry math invariants
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/contracts
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/contracts/package-lock.json
      - uses: foundry-rs/foundry-toolchain@v1
      # node_modules first: forge compiles the whole src/ tree, and the fhEVM
      # imports (@fhevm/solidity, encrypted-types) resolve through it.
      - run: npm ci
      # forge-std is installed at job time (not committed): no submodule churn,
      # and the lockstep with CI's forge version avoids stale-std drift.
      - run: forge install --no-commit foundry-rs/forge-std
      - run: forge test

  devnet:
    name: deploy to a standalone node + lifecycle smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/contracts
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            packages/contracts/package-lock.json
            packages/sdk/package-lock.json
      - run: npm ci
      # `--network localhost` is the only selection the fhevm plugin can instrument on a
      # standalone node (see docs/05 §7a): any other name deploys against mocks that were
      # never installed, and the constructor reverts with no reason string.
      - run: npx hardhat node --hostname 127.0.0.1 --port 8545 &
      - run: sleep 12
      - run: npm run deploy:devnet
      - run: npm run devnet:e2e
      # The owner controls on the same deployment: propose → refused early → executed by a
      # non-owner after the window. It time-travels a week, so it runs before the SDK check
      # (which creates its own task and does not care about the older one).
      - run: npm run devnet:admin
      # The SDK speaks to the same chain this job just deployed: real `uploadAndMonetize`
      # (explicit dev-only `allowUnencrypted`) with on-chain verification, not mocks. Runs
      # after the contracts smoke so a red SDK never masks a red deploy.
      - run: npm ci
        working-directory: packages/sdk
      - run: npm run build
        working-directory: packages/sdk
      - run: npm run devnet:sdk
        working-directory: packages/sdk
