name: contracts

on:
  push:
    branches: [master]
    paths: ["packages/contracts/**", ".github/workflows/contracts.yml"]
  pull_request:
    paths: ["packages/contracts/**", ".github/workflows/contracts.yml"]
  workflow_dispatch:

jobs:
  test:
    name: compile + test + typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/contracts/package-lock.json
      - run: npm ci
      - run: npx hardhat compile
      - run: npx hardhat test
      - run: npx tsc --noEmit
