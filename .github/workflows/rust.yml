name: rust

on:
  push:
    branches: [master]
    paths: ["node/**", "web/tests/**", "packages/contracts/**", ".github/workflows/rust.yml"]
  pull_request:
    paths: ["node/**", "web/tests/**", "packages/contracts/**", ".github/workflows/rust.yml"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: cargo check + fmt + clippy
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@v7
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: node -> target
      - run: cargo fmt --all -- --check
      - run: cargo check --all-features
      # The pure chain-follower build: this is the only place `main.rs`'s
      # `#[cfg(not(feature = "grpc-server"))]` branch is ever compiled, so without it a break in
      # the no-mesh configuration would reach a release image unnoticed.
      - run: cargo check --no-default-features
      - run: cargo clippy --all-features -- -D warnings
      - run: cargo clippy --no-default-features -- -D warnings

  test:
    name: cargo test
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@v7
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: node -> target
      - run: cargo test --all-features
      - run: cargo test --no-default-features

  build:
    name: cargo build --release
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@v7
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: node -> target
      - run: cargo build --release

  devnet-live:
    name: live node registers + bonds on devnet
    runs-on: ubuntu-24.04
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/contracts/package-lock.json
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: node -> target
      # Chain + contracts first: the node needs something sealed to register for.
      - run: npm ci
        working-directory: packages/contracts
      # The execute-e2e script imports the SDK layouts (single source of truth), so the
      # SDK must be built before any hardhat script runs.
      - run: npm ci
        working-directory: packages/sdk
      - run: npm run build
        working-directory: packages/sdk
      - run: npx hardhat node --hostname 127.0.0.1 --port 8545 &
        working-directory: packages/contracts
      - run: sleep 12
      - run: npm run deploy:devnet
        working-directory: packages/contracts
      - run: npx hardhat run scripts/devnet-e2e-check.ts --network localhost
        working-directory: packages/contracts
      - run: npx hardhat run scripts/prepare-node-operator.ts --network localhost
        working-directory: packages/contracts
      - run: cargo build --release
        working-directory: node
      # The operator is hardhat#1 (funded above); the BLS key is a throwaway devnet identity,
      # distinct from every key the contract scripts use. Config goes through a generated TOML
      # rather than nested CM_ env vars so there is exactly one mapping to audit (see
      # `Config::load`); flat overrides like CM_RPC_URL would work too, but the file is explicit
      # about every field the node actually starts with, and it is dumped to the log below.
      - run: |
          node -e "
            const fs = require('fs');
            const a = require('../infra/devnet/addresses.json');
            const toml = [
              '[chain]',
              'rpc_url = \"http://127.0.0.1:8545\"',
              'chain_id = 31337',
              '',
              '[contracts]',
              \`cipher_task = \"\${a.cipherTask}\"\`,
              \`payment_vault = \"\${a.vault}\"\`,
              '',
              '[node]',
              'operator_key = \"0x59c6995e998f97a5a0044966f0945389dc9e86dae88c7a8412f4603b6b78690d\"',
              'bls_pub_key = \"0xabababababababababababababababababababababababababababababababab\"',
              \`data_dir = \"\${process.env.RUNNER_TEMP}/shroud-data\"\`,
              '',
              '[shard]',
              \`cache_dir = \"\${process.env.RUNNER_TEMP}/shroud-cache\"\`,
              '',
              '[mesh]',
              'listen = \"127.0.0.1:17331\"',
            ].join('\n');
            fs.writeFileSync(process.env.RUNNER_TEMP + '/shroud.toml', toml);
            console.log(toml.replace(/operator_key = .*/, 'operator_key = \"0x…\"'));
          "
          ./target/release/shroud-node --config $RUNNER_TEMP/shroud.toml &
        working-directory: node
      # Second operator for the execution e2e: a fresh key (never pasted into the repo).
      # It must differ from node A's key and BLS.
      - run: |
          echo "OPERATOR_B_KEY=0x$(openssl rand -hex 32)" >> $GITHUB_ENV
          echo "OPERATOR_B_BLS=0x$(openssl rand -hex 32)" >> $GITHUB_ENV
      # Fund B before its node starts: the worker burns its bounded registration
      # retries fast, and funding that lands afterwards never gets retried.
      - name: fund operator B before node start
        run: |
          node -e "
            const { ethers } = require('ethers');
            (async () => {
              const provider = new ethers.JsonRpcProvider('http://127.0.0.1:8545');
              const faucet = new ethers.Wallet('0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80', provider);
              const to = new ethers.Wallet(process.env.OPERATOR_B_KEY).address;
              const tx = await faucet.sendTransaction({ to, value: ethers.parseEther('2') });
              await tx.wait();
              console.log('funded operator B', to);
            })();
          "
        working-directory: packages/contracts
        env:
          OPERATOR_B_KEY: ${{ env.OPERATOR_B_KEY }}
      - run: |
          node -e "
            const fs = require('fs');
            const a = require('../infra/devnet/addresses.json');
            const toml = [
              '[chain]',
              'rpc_url = \"http://127.0.0.1:8545\"',
              'chain_id = 31337',
              '',
              '[contracts]',
              \`cipher_task = \"\${a.cipherTask}\"\`,
              \`payment_vault = \"\${a.vault}\"\`,
              '',
              '[node]',
              \`operator_key = \"\${process.env.OPERATOR_B_KEY}\"\`,
              \`bls_pub_key = \"\${process.env.OPERATOR_B_BLS}\"\`,
              \`data_dir = \"\${process.env.RUNNER_TEMP}/shroud-data-b\"\`,
              '',
              '[shard]',
              \`cache_dir = \"\${process.env.RUNNER_TEMP}/shroud-cache\"\`,
              '',
              '[mesh]',
              'listen = \"127.0.0.1:17332\"',
            ].join('\n');
            fs.writeFileSync(process.env.RUNNER_TEMP + '/shroud-b.toml', toml);
            console.log(toml.replace(/operator_key = .*/, 'operator_key = \"0x…\"'));
          "
          ./target/release/shroud-node --config $RUNNER_TEMP/shroud-b.toml &
        working-directory: node
      - run: sleep 90
      - run: npx hardhat run scripts/assert-node-registered.ts --network localhost
        working-directory: packages/contracts
      # Execution e2e: a task with real pins, opened for epoch 0; both live nodes must
      # independently commit the same verified digest. Polls internally, ~2-5 minutes.
      - run: npx hardhat run scripts/devnet-execute-check.ts --network localhost
        working-directory: packages/contracts
        env:
          NODE_CACHE_DIR: ${{ runner.temp }}/shroud-cache
          OPERATOR_B_KEY: ${{ env.OPERATOR_B_KEY }}
