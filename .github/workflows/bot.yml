name: bot

on:
  push:
    branches: [master]
    paths: ["bot/**", ".github/workflows/bot.yml"]
  pull_request:
    paths: ["bot/**", ".github/workflows/bot.yml"]
  workflow_dispatch:

jobs:
  test:
    name: unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bot
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bot/package-lock.json
      # chain.test.js reads the NetworkParams ABI from the compiled Hardhat
      # artifact (the SDK ships no fragment for it), so the contracts must be
      # compiled first — same pattern as the sdk workflow.
      - run: npm ci
        working-directory: packages/contracts
      - run: npx hardhat compile
        working-directory: packages/contracts
      - run: npm ci
      - run: npm test
